# Service skeleton — wedding-card-invitation-web-weddings-service
#
# Lambda functions:
#   publicHandler    -> /public/{proxy+}   no authorizer (storefront, health, etc.)
#   authHandler      -> /auth/{proxy+}     no authorizer (Cognito login/signup)
#   weddingsHandler  -> /admin/{proxy+}    COGNITO_USER_POOLS authorizer (authenticated routes)
#   ordersHandler    -> /orders/{proxy+}   COGNITO_USER_POOLS authorizer (couple-facing orders)
#   internalHandler  -> /internal/{proxy+} no authorizer, API-key protected (build pipeline)
#
# Copy this directory, rename to services/weddings-service, and replace every
# `weddings` token with your domain name (e.g. order-service / order_module).
service: wedding-card-invitation-web-weddings-service
frameworkVersion: '3'

plugins:
  - serverless-prune-plugin

custom:
  prune:
    automatic: true
    number: 2

provider:
  name: aws
  runtime: python3.12
  region: ap-southeast-1
  stage: ${opt:stage, 'dev'}

  # CORS on error responses (401/403 from the authorizer, etc.) so the browser
  # can read the status and the frontend can auto-redirect to sign-in.
  apiGateway:
    gatewayResponses:
      UNAUTHORIZED:
        statusCode: '401'
        responseParameters:
          GatewayResponse.header.Access-Control-Allow-Origin: "'*'"
          GatewayResponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
          GatewayResponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
      ACCESS_DENIED:
        statusCode: '403'
        responseParameters:
          GatewayResponse.header.Access-Control-Allow-Origin: "'*'"
          GatewayResponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
          GatewayResponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
      DEFAULT_4XX:
        responseParameters:
          GatewayResponse.header.Access-Control-Allow-Origin: "'*'"
          GatewayResponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
          GatewayResponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"

  iam:
    role:
      # Explicit short name — the auto-generated one (service+stage+region+
      # "lambdaRole") exceeds IAM's 64-char role name limit for this project.
      name: wedding-card-invitation-web-${opt:stage}-role
      statements:
        - Effect: Allow
          Action:
            - secretsmanager:GetSecretValue
          Resource: '*'
        - Effect: Allow
          Action:
            - cognito-idp:AdminConfirmSignUp
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminAddUserToGroup
            - cognito-idp:CreateGroup
          Resource: '*'
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource:
            - 'arn:aws:s3:::wedding-card-invitation-web-${opt:stage}-receipts*'
            - 'arn:aws:s3:::wedding-card-invitation-web-${opt:stage}-receipts*/*'
            - 'arn:aws:s3:::wedding-card-invitation-web-${opt:stage}-assets*'
            - 'arn:aws:s3:::wedding-card-invitation-web-${opt:stage}-assets*/*'
        # Image-upload presign: scoped to PutObject on the uploads prefix only
        # (never ListObject / whole-bucket). The browser PUTs directly to S3.
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource:
            - 'arn:aws:s3:::${env:ASSETS_BUCKET}/uploads/*'
        # Build-on-demand: trigger an Amplify build after payment (A1). Scoped to
        # the app only (env placeholder — never hardcode the app id).
        - Effect: Allow
          Action:
            - amplify:StartJob
          Resource:
            - 'arn:aws:amplify:${self:provider.region}:${aws:accountId}:apps/${env:AMPLIFY_APP_ID}'
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: '*'

  environment:
    GETDB_CONNECTION: ${env:GETDB_CONNECTION}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID}
    COGNITO_APP_CLIENT_ID: ${env:COGNITO_APP_CLIENT_ID}
    COGNITO_DOMAIN: ${env:COGNITO_DOMAIN}
    RECEIPTS_BUCKET: ${env:RECEIPTS_BUCKET}
    ASSETS_BUCKET: ${env:ASSETS_BUCKET}
    ASSETS_CDN_URL: ${env:ASSETS_CDN_URL}
    SES_SOURCE: ${env:SES_SOURCE}
    ADMIN_NOTIFY_EMAIL: ${env:ADMIN_NOTIFY_EMAIL}
    FRONTEND_URL: ${env:FRONTEND_URL}
    SENDER_NAME: ${env:SENDER_NAME, '<sender-name>'}
    SENDER_PHONE: ${env:SENDER_PHONE, ''}
    SENDER_ADDRESS: ${env:SENDER_ADDRESS, ''}
    API_BASE_URL: ${env:API_BASE_URL, ''}
    PUBLIC_API_BASE_URL: ${env:PUBLIC_API_BASE_URL, ''}
    INTERNAL_API_KEY: ${env:INTERNAL_API_KEY, ''}
    TOYYIBPAY_BASE_URL: ${env:TOYYIBPAY_BASE_URL, 'https://dev.toyyibpay.com'}
    TOYYIBPAY_USER_SECRET_KEY: ${env:TOYYIBPAY_USER_SECRET_KEY, ''}
    TOYYIBPAY_CATEGORY_CODE: ${env:TOYYIBPAY_CATEGORY_CODE, ''}
    AMPLIFY_APP_ID: ${env:AMPLIFY_APP_ID, ''}
    AMPLIFY_BRANCH: ${env:AMPLIFY_BRANCH, 'main'}

functions:
  publicHandler:
    handler: weddings_module.public_handler.lambda_handler
    events:
      - http:
          path: /public/{proxy+}
          method: any
          cors: true
    layers:
      - ${env:WEDDING_CARD_INVITATION_WEB_COMMON_LAYER_ARN}

  authHandler:
    handler: weddings_module.auth_handler.lambda_handler
    events:
      - http:
          path: /auth/{proxy+}
          method: any
          cors: true
    layers:
      - ${env:WEDDING_CARD_INVITATION_WEB_COMMON_LAYER_ARN}

  weddingsHandler:
    handler: weddings_module.handler.lambda_handler
    events:
      - http:
          path: /admin/{proxy+}
          method: any
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            arn: ${env:COGNITO_USER_POOL_ARN}
    layers:
      - ${env:WEDDING_CARD_INVITATION_WEB_COMMON_LAYER_ARN}

  ordersHandler:
    handler: weddings_module.orders_handler.lambda_handler
    events:
      - http:
          path: /orders/{proxy+}
          method: any
          cors: true
          authorizer:
            type: COGNITO_USER_POOLS
            arn: ${env:COGNITO_USER_POOL_ARN}
    layers:
      - ${env:WEDDING_CARD_INVITATION_WEB_COMMON_LAYER_ARN}

  internalHandler:
    handler: weddings_module.orders_handler.internal_lambda_handler
    events:
      - http:
          path: /internal/{proxy+}
          method: any
          cors: true
    layers:
      - ${env:WEDDING_CARD_INVITATION_WEB_COMMON_LAYER_ARN}
